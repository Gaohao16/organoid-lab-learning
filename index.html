 function wellStatus(w){const remaining=w.medium?' · '+fmt(w.mediumVolume)+' µL 示意':'';return w.endpoint?'终点检测已消耗':!w.dome?'未铺胶':!w.gelled?'等待凝胶':!w.medium?'待加液':w.spent?'待维护培养液'+remaining:w.treatment?treatmentName(w)+remaining:'培养液已加入'+remaining;}
 function next(){
  if(special()){
   if(!state.clean)return ['接手'+profile().name+'样本','进入安全柜准备工作面。'+profile().intro,'bench'];
   if(!state.stageSetup)return ['设定'+currentStage().name+'培养','核对来源与当前阶段，记录'+currentStage().setup+'。'+currentStage().text,'bench'];
   if(!state.observed)return ['观察'+profile().name+'结构','把教学板放到显微镜，调焦后点选三个观察位置并记录。结构随模型变化。','microscope'];
   if(!stageDone(state.stageIndex))return functionStage()?['安排专属功能检测','把板移到检测台，选择检测，安排独立平行样本并记录计划。','assay']:['记录本阶段质控','把板移到检测台，核对早期样本与形态记录，预留后期检测样本。','assay'];
   if(profile().stages.some((s,i)=>!stageDone(i)))return ['接手另一个培养阶段','本阶段记录已保存。选择路线中尚未完成的阶段，接手独立的教学板。','bench'];
   return ['专属学习记录已保存','各阶段已留下观察记录。查看实验笔记，将检测计划与后续实际结果分别保存。','assay'];
  }
  if(!state.clean)return ['准备工作面','进入安全柜，核对无菌操作环境，然后准备工作面。','bench'];
  if(!state.ice)return ['把基质放回冰盒','拿起冷基质，放到安全柜左侧的冰盒上。','bench'];
  if(!state.matrix||!state.sample)return ['准备冷态混合液','将冷基质和类器官碎片依次放入混合管。','bench'];
  if(!state.mixed)return ['轻柔混匀','基质和碎片已经进入混合管，轻柔混匀后铺胶。','bench'];
  if(!state.wells.every(w=>w.dome))return ['给三个孔铺胶','拿移液器，装吸头，从混合管吸液，点培养孔中心。同管混悬液连续点胶可用同一吸头；更换液体时换头。','bench'];
  if(!state.wells.every(w=>w.gelled))return ['倒置凝胶 15 分钟','把点胶板放入培养箱，倒置孔板、关门，再开始15分钟凝胶计时。','incubator'];
  if(state.inverted)return ['恢复孔板正放','开门取回安全柜，恢复正放后再沿孔壁加培养液。','bench'];
  if(state.cycles===0&&!state.wells.every(w=>w.medium))return ['沿孔壁加液','把板取回安全柜，吸取培养液，再从每个孔的孔边加液。','bench'];
  if(state.cycles===0)return ['放入培养箱','打开箱门并放入培养板，核对培养条件，关门后推进观察周期。','incubator'];
  if(!state.observed)return ['看看类器官的样子','把板放到显微镜，切换培养孔、调焦并记录观察。','microscope'];
  if(!alive().every(w=>w.exchanged))return ['给类器官换液','取回安全柜，从孔边吸走旧液，弃吸头，换洁净吸头，再从孔边加入新液。','bench'];
  if(!state.wells.some(w=>w.treatment==='drug'))return ['配制给药培养液','到检测台计算母液和培养液用量，再取回安全柜换成给药培养液。','assay'];

  if(!state.readouts.length)return ['安排终点检测','选择 ATP 终点孔；上清采样与后续观察由平行孔承担。','assay'];
  return ['培养之旅已记录','培养、观察、给药对照和终点采样已留下记录。查看笔记，检查还缺哪些实际检测。','assay'];
 }

  const drug=state.wells.filter(w=>w.treatment==='drug'),vehicle=state.wells.filter(w=>w.treatment==='vehicle');
  const gaps=[];if(!vehicle.length||!matchedControls())gaps.push('与每个给药孔匹配的等溶剂比例对照');gaps.push('阳性参照条件与响应标定、无细胞空白、生物重复及实际检测值');
  const typeNotes=special()?'<div class="module-note"><h3>'+profile().name+' · '+profile().model+'</h3><p>当前载入：'+currentStage().name+'的教学样本。已观察阶段：'+(state.studied.length?state.studied.map(i=>profile().stages[i].name).join('、'):'待观察')+'。切换阶段代表接手独立样本。</p><p><b>早期质控已记录：</b>'+(state.qualityStages.length?state.qualityStages.map(i=>profile().stages[i].name).join('、'):'待安排')+'。</p><p><b>专属检测计划：</b></p><ul>'+ (state.functionPlans.length?state.functionPlans.map(x=>{const t=profile().tests.find(t=>t.id===x.test);return '<li>'+profile().stages[x.stage].name+' · '+t.name+'；'+t.sample+'。'+t.setup+' '+t.result+'</li>';}).join(''):'<li>完成结构观察后，到检测台安排独立平行样本。</li>')+'</ul></div>':'<p><b>基础部分：</b>基质培养操作、维护、观察与对照训练。各模型的建立和定向分化在专属实验室分别记录。</p>';
  $('#notebook-content').innerHTML='<p class="print-only">类器官实验室 · '+profile().name+' · '+new Date().toLocaleDateString('zh-CN')+'</p>'+typeNotes+'<div class="notebook-grid">'+state.wells.map((w,i)=>'<div class="notebook-well"><b>'+letter(i)+' 孔</b><br>'+wellStatus(w)+'<br>'+treatmentName(w)+(w.concentration!==null?' · '+w.concentration+' µM 教学浓度':'')+(w.vehiclePercent!==null?'<br>终溶剂比例 '+fmt(w.vehiclePercent)+'%':'')+'<br>'+(w.endpoint?'ATP：样本已消耗；数值待实测':'可用于后续培养或平行观察')+'</div>').join('')+'</div><p><b>给药对照检查：</b>'+ (drug.length?'已安排 '+drug.length+' 个给药孔。':'给药孔待安排。')+(vehicle.length?'已留溶剂对照。':'溶剂对照待安排。')+'还需补充'+gaps.join('、')+'。</p><p><b>结果记录：</b>形态、阶段样本及检测设置均为教学记录，功能数值由实际实验提供。各实验室分别保存记录，基础训练不作为各类模型的诱导结果。</p><p><b>通用上清采样：</b>'+(state.supernatant?'已记录采样计划；检测值待采集。':'待安排；具体指标与采样方式按模型确定。')+'</p><ul class="journal">'+(state.logs.length?state.logs.map(x=>'<li><time>'+esc(x.time)+'</time>'+esc(x.text)+'</li>').join(''):'<li>还没有操作记录，进入安全柜开始。</li>')+'</ul>';
  $('#print-record').innerHTML='<h1>类器官实验室 · '+profile().name+'实验笔记</h1>'+$('#notebook-content').innerHTML;
 }
 function about(){
  $('#about-content').innerHTML='<p><b>键盘：</b>P 拿移液器；T 到吸头盒；F 培养液；M 混合管；W 废物；A/B/C 孔边，Shift+A/B/C 孔中心。数字1–4进入安全柜、培养箱、显微镜和检测台（5也可进入检测台）。G 拿培养板后用数字搬板。Z 冷基质，X 碎片，I 冰盒；K 准备工作面，Q 翻转无培养液孔板；H 倒置凝胶15分钟，O 箱门，V 记录观察。</p><p><b>动作近景：</b>空格控制柱塞；↓ 入液或装头；↑ 提离；E 弃头。Esc 或 × 随时收起，R 继续，暂停时 D 放弃这次演示。也可直接拖机身、按柱塞和红色弃头键；辅助按钮在折叠面板中。</p><p><b>基础部分</b>练习器具、无菌操作、冷态基质、铺胶、换液、调焦、浓度与对照。基质培养只是适用体系的一条操作路线。</p><p><b>专属部分</b>分肝、肠、肺气道与肾四类。每类有自己的来源、阶段路线、结构示意及检测台设置。你接手已建立的教学样本；阶段切换载入独立样本，各阶段记录保留。</p><p>当前实验室：'+profile().name+' · '+profile().model+'。'+profile().intro+'</p><p>先在安全柜记录培养设定，再把板移到显微镜调焦、标注结构，最后到检测台安排独立平行样本、完成三项检测设置并保存计划。拿起后可持续移动，点目标只定位。动作近景中分步操作柱塞，观察液柱和容器液面；混匀采用冰上慢速往复。</p><p>各实验室分别保存进度；上一版肝类器官记录保留在肝模块。重新开始只清空当前实验室。真实配方、培养日、剂量和检测值按具体样本与协议确定。图中形态为独立绘制的示意。</p><p>交互参考 LabXchange 的可操作实验台和 Labster 细胞培养任务；科学依据见以下官方来源。</p><ul>'+[...(profile().refs||[]),...REFERENCES,['Eppendorf · 正向移液动作顺序','https://www.eppendorf.com/product-media/doc/en/176179/Eppendorf_Liquid-Handling_Operating-manual_Reference-2_Eppendorf-Reference-2.pdf'],['STEMCELL · 冷态基质轻柔混匀','https://www.stemcell.com/intestinal-organoid-suspension-culture-protocol.html'],...Object.entries(MODULES).filter(([id])=>id!=='basic'&&id!==state.module).flatMap(([,p])=>p.refs)].map(([t,u])=>'<li><a target="_blank" rel="noopener noreferrer" href="'+u+'">'+t+'</a></li>').join('')+'</ul><button data-act="reset" class="danger">重新开始当前实验室</button>';
 }
 document.addEventListener('click',async e=>{
  if(suppressClick>Date.now()){suppressClick=0;e.preventDefault();return;}suppressClick=0;
  const motion=e.target.closest('[data-motion]');if(motion){e.preventDefault();await LabMotion.step(motion.dataset.motion);return;}
  if(busy&&e.target.closest('[data-object],[data-target],[data-field],[data-act]')&&!['notebook','about'].includes(e.target.closest('[data-act]')?.dataset.act)){e.preventDefault();fail('先完成动作近景里的操作。');return;}

  const close=e.target.closest('[data-close]');if(close){$('#'+close.dataset.close).close();return;}
  const o=e.target.closest('[data-object]');if(o){pick(o.dataset.object);return;}
  const a=e.target.closest('[data-act]');const t=e.target.closest('[data-target]');if(t&&!a){operate(t.dataset.target);return;}
  if(!a)return;e.preventDefault();
  if(a.dataset.act==='well-select'){if(LabMotion.pending())return fail('先继续或放弃本次动作，再选择其他培养孔。');selectWell(Number(a.dataset.value));render();return;}
  await action(a.dataset.act,a.dataset.value);
 });
 function setField(key,value){
  if(LabMotion.pending())return fail('先继续或放弃这次动作，再修改实验设置。');
  if(busy)return {ok:false,message:'动作进行中，设置保持不变。'};
  if(state.load&&['stock','stockVehicle','target','total','solutionKind'].includes(key))return fail('先处理吸头内液体，再修改下一批培养液设置。');
  if(key==='functionTest'){if(!functionStage()||!profile().tests.some(t=>t.id===value))return fail('选择本模型的检测项目。');state.functionTest=value;state.sampleAllocated=false;state.functionSteps=[];render();return {ok:true};}
  if(['conditions','compare'].includes(key)){if(typeof value!=='boolean')return fail('此设置需要开启或关闭。');state[key]=value;}
  else if(key==='solutionKind'){if(!['drug','vehicle','positive'].includes(value))return fail('请选择有效培养液用途。');state[key]=value;}
  else{const n=Number(value),ranges={volume:[1,1000],focus:[0,100],zoom:[1,2],stock:[.001,1e9],stockVehicle:[0,100],target:[.001,1e9],total:[.001,1e9]};if(!ranges[key]||!Number.isFinite(n)||n<ranges[key][0]||n>ranges[key][1]||(key==='zoom'&&![1,1.5,2].includes(n)))return fail('输入值超出当前教学设置范围。');if(key==='volume'&&state.load)return fail('移液器内已有液体，请加液或弃液后再设置体积。');if(key==='zoom'&&state.zoom!==n){state.focus=Math.max(0,state.focus-6);state.marked=[];state.panX=0;state.panY=0;}state[key]=n;}
  if(['stock','stockVehicle','target','total','solutionKind'].includes(key))state.solution=null;
  if(key==='focus'){if($('#focus-value'))$('#focus-value').textContent=state.focus;if($('#focus'))$('#focus').value=state.focus;drawScope();LabScope.refresh(state);persist();}
  else if(['stock','stockVehicle','target','total','solutionKind'].includes(key)&&state.view==='assay'){
   const v=state.target*state.total/state.stock,ok=state.target>0&&state.target<state.stock;
   $('#calculation').innerHTML=ok?'母液或等体积载体：'+fmt(v)+' µL<br>培养液：'+fmt(state.total-v)+' µL<br>终溶剂比例：'+fmt(state.stockVehicle*v/state.total)+'%':'输入有效浓度与体积';
   persist();
  }else if(key==='volume'){persist();}else render();
  return {ok:true};
 }
 document.addEventListener('input',e=>{const k=e.target.dataset.field;if(k==='focus')setField(k,e.target.value);else if(e.target.type==='number'&&e.target.value!==''&&Number.isFinite(Number(e.target.value))&&(Number(e.target.value)>0||k==='stockVehicle'&&Number(e.target.value)===0))setField(k,e.target.value)});
 document.addEventListener('change',e=>{const k=e.target.dataset.field;if(k)setField(k,['conditions','compare'].includes(k)?e.target.checked:e.target.value)});
 LabMotion.init({state:()=>state,lock:v=>{busy=v;$('#undo-button').disabled=v||!undo.length},fail,message:say,render,sprite});
 try{if(sessionStorage.getItem('organoid-action-pending')){sessionStorage.removeItem('organoid-action-pending');feedback.text='上次动作未结束，已恢复到动作开始前。请重新完成这次演示。'}}catch{}
 function typing(e){return e.target.closest('input,select,textarea,[contenteditable="true"]')||document.querySelector('dialog[open]');}
 document.addEventListener('keydown',e=>{
  if(e.target.closest('[data-focus-wheel]')&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setField('focus',e.key==='Home'?0:e.key==='End'?100:Math.max(0,Math.min(100,state.focus+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)*(e.target.closest('[data-focus-wheel]').dataset.focusWheel==='coarse'?4:1))));return;}
  if(state.view==='microscope'&&e.target.id==='scope-canvas'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();scopePan(e.key==='ArrowLeft'?-12:e.key==='ArrowRight'?12:0,e.key==='ArrowUp'?-12:e.key==='ArrowDown'?12:0);return;}
  if(typing(e)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(LabMotion.key(e))return;if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='escape'){if(state.load)fail('先加液或弃头，再把带液移液器放下。');else{state.held=null;say('已放下物品。');render();}return;}
  const objects={p:'pipette',g:'plate',z:'matrix',x:'sample'},targets={t:'tips',f:'medium',m:'mix',w:'waste',i:'ice',j:'drug'};
  if(objects[k]){e.preventDefault();pick(objects[k]);return;}
  if(targets[k]){e.preventDefault();operate(targets[k]);return;}
  if(['a','b','c'].includes(k)){e.preventDefault();if(state.view==='microscope'){selectWell(['a','b','c'].indexOf(k));render();}else operate('well:'+['a','b','c'].indexOf(k)+':'+(e.shiftKey?'center':'edge'));return;}
  if(['1','2','3','4','5'].includes(k)){e.preventDefault();operate('view:'+['bench','incubator','microscope','assay','assay'][Number(k)-1]);return;}
  if(k==='k'){e.preventDefault();action('clean');}else if(k==='o'){e.preventDefault();action('door');}else if(k==='v'){e.preventDefault();action('record');}else if(k==='h'){e.preventDefault();action('gel');}else if(k==='q'){e.preventDefault();action('invert');}
 });
 document.addEventListener('keyup',e=>{if(!typing(e))LabMotion.key(e,true);});
 window.addEventListener('blur',()=>{if(LabMotion.active())LabMotion.pause();});
 window.addEventListener('resize',()=>LabScene.refresh(state));
 let focusGesture=null,doorGesture=null,scopeGesture=null;
 function scopePan(dx,dy){if(state.location!=='microscope'){say('先把孔板放到载物台，再移动视野。',true);return;}state.panX=Math.max(-240,Math.min(240,state.panX+dx));state.panY=Math.max(-240,Math.min(240,state.panY+dy));drawScope();LabScope.refresh(state);persist();}
 document.addEventListener('pointerdown',e=>{if(e.target.id==='scope-canvas'&&!busy){e.preventDefault();e.target.focus();e.target.setPointerCapture(e.pointerId);scopeGesture={id:e.pointerId,x:e.clientX,y:e.clientY};}});
 document.addEventListener('pointermove',e=>{if(scopeGesture?.id===e.pointerId){const r=e.target.getBoundingClientRect(),factor=600/r.width/(state.zoom===1?1:state.zoom===1.5?2.5:5);scopePan((e.clientX-scopeGesture.x)*factor,(e.clientY-scopeGesture.y)*factor);scopeGesture.x=e.clientX;scopeGesture.y=e.clientY;}});
 document.addEventListener('pointerup',()=>scopeGesture=null);document.addEventListener('pointercancel',()=>scopeGesture=null);
 document.addEventListener('pointerdown',e=>{if(busy||LabMotion.pending())return;const wheel=e.target.closest('[data-focus-wheel]'),handle=e.target.closest('.incubator-handle');if(wheel){e.preventDefault();wheel.focus();wheel.setPointerCapture(e.pointerId);focusGesture={id:e.pointerId,y:e.clientY,value:state.focus,factor:wheel.dataset.focusWheel==='coarse'?1.2:.15};}else if(handle){e.preventDefault();handle.setPointerCapture(e.pointerId);doorGesture={id:e.pointerId,x:e.clientX,opened:state.door,preview:state.door?1:0};}});
 document.addEventListener('pointermove',e=>{if(focusGesture?.id===e.pointerId){e.preventDefault();setField('focus',Math.round(Math.max(0,Math.min(100,focusGesture.value+(focusGesture.y-e.clientY)*focusGesture.factor))));}if(doorGesture?.id===e.pointerId){e.preventDefault();const p=Math.min(1,Math.abs(e.clientX-doorGesture.x)/130);doorGesture.preview=doorGesture.opened?1-p:p;LabScene.previewDoor(state,doorGesture.preview);}});
 document.addEventListener('pointerup',e=>{if(focusGesture?.id===e.pointerId)focusGesture=null;if(doorGesture?.id===e.pointerId){const g=doorGesture;doorGesture=null;if(Math.abs(e.clientX-g.x)>15){suppressClick=Date.now()+350;action('door',String(g.preview));}else LabScene.refresh(state);}});
 document.addEventListener('pointercancel',()=>{focusGesture=null;doorGesture=null;LabScene.refresh(state);});
 document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-object]');if(!el||busy||e.button!==0)return;if(LabMotion.pending()){drag=null;fail('动作已暂停。按 R 继续，或按 D 放弃本次演示后再拿其他器具。');return;}LabMotion.move(e.clientX,e.clientY);drag={id:el.dataset.object,x:e.clientX,y:e.clientY,active:false,pointer:e.pointerId};});
 document.addEventListener('pointermove',e=>{
  if(!busy&&state.held&&e.pointerType!=='touch')LabMotion.move(e.clientX,e.clientY);
  if(!drag||drag.pointer!==e.pointerId||busy)return;if(LabMotion.pending()){drag=null;return;}
  if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){if(drag.id==='plate'&&state.location==='incubator'&&!state.door){drag=null;fail('先打开培养箱门，再取出培养板。');return;}if(state.load&&state.held!==drag.id){drag=null;fail('先处理移液器内的液体。');return;}drag.active=true;state.held=drag.id;LabMotion.sync();}
  if(!drag.active)return;e.preventDefault();LabMotion.move(e.clientX,e.clientY);document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-target]');if(target)target.classList.add('drop-hover');
 },{passive:false});
 document.addEventListener('pointerup',e=>{
  if(!drag||drag.pointer!==e.pointerId)return;const current=drag;drag=null;if(LabMotion.pending())return;
  if(current.active){suppressClick=Date.now()+300;document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-target]');if(t)operate(t.dataset.target,current.id);else{state.held=current.id;say('已拿起'+OBJECTS[current.id]+'，器具保持在手中，可继续移到目标。');render();}}
 });
 document.addEventListener('pointercancel',()=>{drag=null;LabMotion.sync()});
 render();
 if(document.modelContext?.registerTool){
  const register=(name,description,inputSchema,execute,readOnlyHint=false)=>document.modelContext.registerTool({name,description,inputSchema,execute:async input=>await execute(input),annotations:{readOnlyHint}});
  register('organoid_lab_status','Read virtual organoid lab state and current guidance. Teaching data only; no real assay values.',{type:'object',properties:{},additionalProperties:false},()=>({state:JSON.parse(JSON.stringify(state)),next:next(),feedback,busy,motion:LabMotion.status()}),true);
  register('organoid_lab_operate','Perform the same validated virtual operation as the lab UI. Target examples: mix, ice, tips, medium, drug, waste, well:0:center, well:0:edge, view:bench.',{type:'object',properties:{target:{type:'string'},item:{type:'string',enum:Object.keys(OBJECTS)}},required:['target'],additionalProperties:false},({target,item})=>{if(LabMotion.pending())return fail('先继续或放弃本次动作。');if(busy)return fail('先完成当前器具动作。');if(state.load&&item&&item!=='pipette')return fail('先处理吸头内液体，再拿其他器具。');if(item)state.held=item;return operate(target,item||state.held)});
  register('organoid_lab_action','Use the same validated visible lab action, including independent modules, teaching-stage samples, structural annotations and function plans.',{type:'object',properties:{action:{type:'string',enum:['motion','view','pick','move','clean','mix','invert','gel','door','advance','record','prepare','supernatant','atp','undo','module','load-stage','configure-stage','mark-feature','allocate-sample','readout-step','plan-function','quality-step','record-quality']},value:{type:'string'}},required:['action'],additionalProperties:false},({action:a,value})=>action(a,value));
  register('organoid_lab_setting','Set a visible lab input, including this model\'s functional readout selection.',{type:'object',properties:{field:{type:'string',enum:['volume','focus','zoom','stock','stockVehicle','target','total','selected','conditions','compare','solutionKind','functionTest']},value:{type:['string','number','boolean']}},required:['field','value'],additionalProperties:false},({field,value})=>{if(field==='selected'){if(LabMotion.pending())return fail('先继续或放弃本次动作，再选择其他培养孔。');if(busy)return {ok:false,message:'先完成当前器具动作。'};if(!Number.isInteger(Number(value))||Number(value)<0||Number(value)>2)return fail('请选择 A、B 或 C 孔。');selectWell(Number(value));render();return {ok:true};}return setField(field,value)});
 }
})();

</script></body></html>
